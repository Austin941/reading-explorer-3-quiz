<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Explorer 3 (3rd ed.) · Ch1 & Ch2 課本選擇題刷題系統</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            primary: 'var(--text-primary)',
            secondary: 'var(--text-secondary)',
            tertiary: 'var(--text-tertiary)',
            accent: 'var(--accent)',
            'accent-light': 'var(--accent-light)',
            'elevated': 'var(--bg-elevated)',
            'subtle': 'var(--border-subtle)',
            'success-bg': 'var(--success-bg)',
            'danger-bg': 'var(--danger-bg)',
            'warning-bg': 'var(--warning-bg)'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="app/css/style.css" />
</head>
<body class="selection:bg-blue-500/20">

  <!-- Apple-Style Top Navigation Bar -->
  <header class="sticky top-0 z-50 glass border-b border-subtle">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand & Title -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i data-lucide="check-square" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg tracking-tight text-primary">Reading Explorer 3</h1>
            <span class="badge badge-red font-mono text-[10px]">Ch1 + Ch2 選擇題專練</span>
          </div>
          <p class="text-xs text-secondary hidden sm:block">課文閱讀理解 · 紅色核心單字配對 · 課本題庫刷題</p>
        </div>
      </div>

      <!-- Center Navigation Tabs -->
      <nav class="flex items-center gap-1.5 p-1 rounded-full bg-elevated border border-subtle shadow-sm">
        <button data-view="quiz" class="nav-tab text-xs active">
          <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
          選擇題刷題
        </button>
        <button data-view="review" class="nav-tab text-xs flex items-center gap-1">
          <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
          錯題筆記本
          <span id="nav-mistake-badge" class="badge badge-red font-mono hidden">0</span>
        </button>
      </nav>

      <!-- Right Action Controls -->
      <div class="flex items-center gap-2">
        <span id="header-accuracy-badge" class="badge badge-green hidden lg:inline-flex text-xs font-mono">100% 正確率</span>

        <!-- Sound Toggle -->
        <button id="btn-toggle-sound" class="btn btn-ghost p-2 rounded-full" title="切換音效">
          <i data-lucide="volume-2" class="w-4 h-4"></i>
        </button>

        <!-- Dark / Light Theme Toggle -->
        <button id="btn-toggle-theme" class="btn btn-ghost p-2 rounded-full" title="切換深淺模式">
          <i data-lucide="moon" class="w-4 h-4"></i>
        </button>

        <!-- Firebase Config Modal -->
        <button id="btn-open-firebase-cfg" class="btn btn-ghost p-2 rounded-full text-secondary" title="雲端 Firebase 設定">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>

        <!-- Google Login Button -->
        <button id="btn-login-google" class="btn btn-secondary text-xs py-2 px-3.5">
          <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
          Google 登入同步
        </button>

        <!-- User Profile Dropdown Box -->
        <div id="user-profile-box" class="hidden flex items-center gap-2 pl-2 border-l border-subtle">
          <img id="user-avatar" class="w-8 h-8 rounded-full border border-subtle object-cover" src="" alt="avatar" />
          <span id="user-name" class="text-xs font-bold text-primary max-w-[90px] truncate hidden sm:inline-block"></span>
          <button id="btn-user-logout" class="btn btn-ghost p-1.5 text-secondary hover:text-danger rounded-full" title="登出">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Viewport -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <div id="view-quiz"></div>
    <div id="view-review" class="hidden"></div>
  </main>

  <!-- Firebase Configuration Modal -->
  <div id="firebase-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="card max-w-md w-full p-6 space-y-4 animate-fade-in shadow-2xl">
      <div class="flex items-center justify-between border-b border-subtle pb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="cloud" class="w-5 h-5 text-accent"></i>
          <h3 class="font-bold text-base text-primary">Google / Firebase 雲端同步設定</h3>
        </div>
        <button id="btn-close-firebase-modal" class="btn btn-ghost p-1.5 rounded-full text-secondary">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <p class="text-xs text-secondary leading-relaxed">
        本系統具備離線優先功能，所有選擇題刷題進度與錯題本已自動保存在本機瀏覽器中。若希望透過 Google 帳號在手機/平板/電腦跨裝置即時同步，可於此貼上 Firebase Web Config：
      </p>

      <textarea id="firebase-cfg-input" rows="7" class="w-full text-xs font-mono p-3 rounded-xl border border-subtle bg-elevated text-primary focus:outline-none focus:ring-2 focus:ring-accent" placeholder='{\n  "apiKey": "AIzaSy...",\n  "authDomain": "your-app.firebaseapp.com",\n  "projectId": "your-app"\n}'></textarea>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button onclick="document.getElementById('firebase-modal').classList.add('hidden')" class="btn btn-ghost text-xs">取消</button>
        <button id="btn-save-firebase-cfg" class="btn btn-primary text-xs">儲存並連接</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-subtle py-6 mt-12 text-center text-xs text-secondary">
    <div class="max-w-7xl mx-auto px-4 space-y-1">
      <p>Reading Explorer 3 [3rd ed.] · Chapter 1 & Chapter 2 課本選擇題刷題系統</p>
      <p class="text-tertiary">120 題課本選擇題真題庫 · 課文段落定位與中文詳解 · 錯題集中消滅</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="app/data/quiz_data.js"></script>
  <script src="app/js/auth.js"></script>
  <script src="app/js/quiz.js"></script>
  <script src="app/js/review.js"></script>
  <script src="app/js/app.js"></script>
</body>
</html>
