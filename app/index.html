<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f2f2f7" />
  
  <title>Reading Explorer 3 · 課本選擇題刷題系統 (手機極速跳題版)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            primary: 'var(--text-primary)',
            secondary: 'var(--text-secondary)',
            tertiary: 'var(--text-tertiary)',
            accent: 'var(--accent)',
            'accent-light': 'var(--accent-light)',
            'elevated': 'var(--bg-elevated)',
            'subtle': 'var(--border-subtle)',
            'success-bg': 'var(--success-bg)',
            'danger-bg': 'var(--danger-bg)',
            'warning-bg': 'var(--warning-bg)'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Custom Mobile-First Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="selection:bg-blue-500/20">

  <!-- Mobile Ergonomic Sticky Navigation Bar -->
  <header class="sticky top-0 z-40 glass">
    <div class="max-w-3xl mx-auto px-3 sm:px-4 h-14 flex items-center justify-between gap-2">
      
      <!-- Brand & View Switcher -->
      <div class="flex items-center gap-1.5 p-0.5 rounded-full bg-elevated border border-subtle">
        <button data-view="quiz" class="nav-tab text-xs active">
          <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
          選擇題刷題
        </button>
        <button data-view="review" class="nav-tab text-xs flex items-center gap-1">
          <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
          錯題本
          <span id="nav-mistake-badge" class="badge badge-red font-mono hidden">0</span>
        </button>
      </div>

      <!-- Right Action Controls (Compact for mobile) -->
      <div class="flex items-center gap-1">
        <!-- Sound Toggle -->
        <button id="btn-toggle-sound" class="btn btn-ghost p-1.5 rounded-full w-9 h-9" title="切換音效">
          <i data-lucide="volume-2" class="w-4 h-4"></i>
        </button>

        <!-- Dark / Light Theme Toggle -->
        <button id="btn-toggle-theme" class="btn btn-ghost p-1.5 rounded-full w-9 h-9" title="切換深淺模式">
          <i data-lucide="moon" class="w-4 h-4"></i>
        </button>

        <!-- Firebase Config -->
        <button id="btn-open-firebase-cfg" class="btn btn-ghost p-1.5 rounded-full w-9 h-9 text-secondary" title="雲端設定">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>

        <!-- Google Login Button -->
        <button id="btn-login-google" class="btn btn-secondary text-xs py-1.5 px-3 rounded-full">
          <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Google </span>登入
        </button>

        <!-- User Profile Dropdown -->
        <div id="user-profile-box" class="hidden flex items-center gap-1.5 pl-1.5 border-l border-subtle">
          <img id="user-avatar" class="w-7 h-7 rounded-full border border-subtle object-cover" src="" alt="avatar" />
          <button id="btn-user-logout" class="p-1 text-secondary hover:text-danger rounded-full" title="登出">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Viewport -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-3 sm:px-4 pt-3 pb-28">
    <div id="view-quiz"></div>
    <div id="view-review" class="hidden"></div>
  </main>

  <!-- Global Fixed Bottom Thumb Bar (下方只保留換題及第幾題) -->
  <div id="global-bottom-bar" class="bottom-bar glass-bottom border-t border-subtle px-4 py-2.5 flex items-center justify-between gap-3 max-w-md mx-auto sm:max-w-lg md:max-w-xl">
    <!-- 上一題換題按鈕 -->
    <button id="bar-prev" class="btn btn-ghost h-11 px-3 sm:px-4 rounded-2xl flex items-center gap-1 font-bold text-sm text-secondary disabled:opacity-30 disabled:pointer-events-none active:scale-95 shrink-0" title="上一題">
      <i data-lucide="chevron-left" class="w-5 h-5"></i>
      <span class="text-xs font-semibold">上一題</span>
    </button>

    <!-- 中央第幾題按鈕（點擊展開題目跳轉面板） -->
    <button id="bar-open-jump" class="btn btn-secondary h-11 px-4 rounded-2xl flex items-center justify-center gap-1.5 font-bold text-sm text-primary border border-subtle shadow-sm active:scale-95 transition-all flex-1 max-w-[210px]" title="點擊展開題目跳轉面板">
      <i data-lucide="layout-grid" class="w-4 h-4 text-accent"></i>
      <span id="bar-index-label" class="font-mono text-sm whitespace-nowrap">第 1 / 120 題</span>
    </button>

    <!-- 下一題換題按鈕 -->
    <button id="bar-next" class="btn btn-primary h-11 px-3 sm:px-4 rounded-2xl flex items-center gap-1 font-bold text-sm shadow-md active:scale-95 shrink-0" title="下一題">
      <span id="bar-next-text" class="text-xs font-semibold">下一題</span>
      <i id="bar-next-icon" data-lucide="chevron-right" class="w-5 h-5"></i>
    </button>
  </div>

  <!-- Redesigned iOS Bottom Sheet: Quick Jump Navigator (全功能題號總覽跳轉) -->
  <div id="jump-overlay" class="sheet-overlay"></div>
  <div id="jump-sheet" class="bottom-sheet">
    <div class="sheet-drag-handle"></div>
    
    <!-- Jump Sheet Header -->
    <div class="px-5 py-3 border-b border-subtle flex items-center justify-between shrink-0">
      <div>
        <div class="flex items-center gap-2">
          <h4 class="font-bold text-base text-primary">題目快速跳轉</h4>
          <span id="jump-sheet-count" class="badge badge-blue font-mono">120 題</span>
        </div>
        <p class="text-[11px] text-secondary mt-0.5">點擊任意題號即可直達該題</p>
      </div>
      <button id="sheet-jump-close" class="btn btn-ghost p-1.5 rounded-full text-secondary" title="關閉">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Quick Stats & Filter Chips inside Jump Drawer -->
    <div class="px-5 pt-3 pb-2 border-b border-subtle space-y-2.5 shrink-0 bg-elevated/50">
      <!-- Legend & Counters -->
      <div class="flex items-center justify-between text-xs font-semibold text-secondary">
        <div class="flex items-center gap-3">
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-success"></span> 正確: <b id="stat-correct-count" class="text-success">0</b></span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-danger"></span> 錯誤: <b id="stat-wrong-count" class="text-danger">0</b></span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-border-subtle"></span> 未答: <b id="stat-unanswered-count">120</b></span>
        </div>
        <span id="stat-accuracy-label" class="font-bold text-primary">正確率: 0%</span>
      </div>

      <!-- Quick Filter Pills inside sheet -->
      <div class="scroll-pills -mx-2 px-2">
        <button id="jump-filter-all" class="pill-btn active">全部題號</button>
        <button id="jump-filter-unanswered" class="pill-btn">只看未作答</button>
        <button id="jump-filter-wrong" class="pill-btn text-danger">只看錯題</button>
        <button id="jump-filter-grouped" class="pill-btn">依單元分組</button>
      </div>
    </div>

    <!-- Scrollable Jump Content Viewport -->
    <div id="sheet-jump-content" class="p-5 overflow-y-auto space-y-4 max-h-[62vh]"></div>
  </div>

  <!-- iOS Bottom Sheet: Reading Passage (課文底端抽屜) -->
  <div id="passage-overlay" class="sheet-overlay"></div>
  <div id="passage-sheet" class="bottom-sheet">
    <div class="sheet-drag-handle"></div>
    <div class="px-5 py-3 border-b border-subtle flex items-center justify-between shrink-0">
      <div>
        <span class="badge badge-blue text-[10px] mb-0.5">課文對照</span>
        <h4 id="sheet-passage-title" class="font-bold text-sm text-primary">課文原文</h4>
      </div>
      <button id="sheet-passage-close" class="btn btn-ghost p-1.5 rounded-full text-secondary" title="關閉">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <div id="sheet-passage-body" class="p-5 overflow-y-auto space-y-4 text-sm leading-relaxed text-primary max-h-[65vh]"></div>
  </div>

  <!-- Firebase Configuration Modal -->
  <div id="firebase-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="card max-w-sm w-full p-5 space-y-3.5 animate-fade-in shadow-2xl">
      <div class="flex items-center justify-between border-b border-subtle pb-2.5">
        <div class="flex items-center gap-1.5">
          <i data-lucide="cloud" class="w-4 h-4 text-accent"></i>
          <h3 class="font-bold text-sm text-primary">Google 雲端同步設定</h3>
        </div>
        <button id="btn-close-firebase-modal" class="btn btn-ghost p-1 rounded-full text-secondary">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <p class="text-xs text-secondary leading-relaxed">
        本站支援手機離線使用，進度已自動保存在本機中。若需跨裝置即時同步，可於此貼上 Firebase Web Config：
      </p>

      <textarea id="firebase-cfg-input" rows="6" class="w-full text-xs font-mono p-3 rounded-xl border border-subtle bg-elevated text-primary focus:outline-none focus:ring-2 focus:ring-accent" placeholder='{\n  "apiKey": "AIzaSy...",\n  "authDomain": "your-app.firebaseapp.com",\n  "projectId": "your-app"\n}'></textarea>

      <div class="flex items-center justify-end gap-2 pt-1">
        <button onclick="document.getElementById('firebase-modal').classList.add('hidden')" class="btn btn-ghost text-xs">取消</button>
        <button id="btn-save-firebase-cfg" class="btn btn-primary text-xs">儲存並連接</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="data/quiz_data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/review.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
